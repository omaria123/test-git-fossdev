services:
  product-service:
    build: ./product_service
    ports:
      - "8001:8000"
    networks:
      - service-net

  discount-service:
    build: ./discount_service
    ports:
      - "8003:8003"
    networks:
      - service-net

  order-service:
    build: ./order_service
    ports:
      - "8002:8000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000
      DISCOUNT_SERVICE_URL: http://discount-service:8003
    depends_on:
      product-service:
        condition: service_started
    networks:
      - service-net

networks:
  service-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24



    